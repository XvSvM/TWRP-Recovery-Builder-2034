name: TWRP Recovery Builder 2024

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'TWRP Minimal-Manifest Branch'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
        - twrp-14.1
        - twrp-12.1
        - twrp-11
        - twrp-9.0
      DEVICE_TREE:
        description: 'Custom Recovery Tree' 
        required: true
        default: 'https://github.com'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch' 
        required: true
        default: 'diana_p1_arm64-userdebug-14-UP1A.231105.001.A1-eng.ubuntu.20250217.194226-release-keys'
      DEVICE_PATH:
        description: 'Specify your Device Path' 
        required: true
        default: 'device/askey/adt3'
      DEVICE_NAME:
        description: 'Specify your Device Codename' 
        required: true
        default: 'adt3'
      BUILD_TARGET:
        description: 'Specify your Build Target' 
        required: true
        default: 'vendorboot'
        type: choice
        options:
        - boot
        - recovery
        - vendorboot
      LDCHECK:
        description: 'Path of blobs to check' 
        required: true
        default: 'system/bin/qseecomd'
      RECOVERY_TAR:
        description: 'Release Recovery.tar For Samsung devices'
        required: false
        default: false
        type: boolean
      RECOVERY_INSTALLER:
        description: 'Include recovery installer.zip'
        type: boolean
        required: true
        default: true

jobs:
  build:
    name: Build TWRP by ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    permissions:
      contents: write
    steps:
    - name: Check Out
      uses: actions/checkout@v3
      
    - name: Display Inputs
      run: |
        echo "::group::User Environment Variables"
        echo "Displaying variables/inputs."
        echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
        echo "Device Tree: ${{ github.event.inputs.DEVICE_TREE }}"
        echo "Device Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
        echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
        echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
        echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}image"
        echo "Include Recovery Installer: ${{ github.event.inputs.RECOVERY_INSTALLER }}"
        echo "Release recovery.tar For Samsung devices: ${{ github.event.inputs.RECOVERY_TAR }}"
        echo "::endgroup::"

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main
      
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24
        
    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib lib32ncurses5-dev x11proto-core-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libtinfo5 libgflags-dev
        sudo add-apt-repository universe
        sudo apt -y install libncurses5

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 8

    - name: Install Git-Repo
      run: |
        mkdir ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Check Manifest Branch
      uses: haya14busa/action-cond@v1
      id: manifest
      with:
        cond: ${{ github.event.inputs.MANIFEST_BRANCH == 'twrp-11' || github.event.inputs.MANIFEST_BRANCH == 'twrp-12.1' || github.event.inputs.MANIFEST_BRANCH == 'twrp-14.1' }}
        if_true: https://github.com
        if_false: https://github.com

    - name: Initialize Repo
      run: |
        mkdir workspace
        cd workspace
        git config --global user.name "builder"
        git config --global user.email "builder@example.com"
        repo init --depth=1 -u ${{ steps.manifest.outputs.value }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}
  
    - name: Repo Sync
      run: |
        cd workspace
        repo sync -j$(nproc --all) --force-sync

    - name: Clone Device Tree
      run: |
        cd workspace
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        cd ${{ github.event.inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Apply Device Tree Fixes
      run: |
        cd workspace/${{ github.event.inputs.DEVICE_PATH }}
        
        cat << 'EOF' > BoardConfig.mk
        DEVICE_PATH := device/askey/adt3
        ALLOW_MISSING_DEPENDENCIES := true
        AB_OTA_UPDATER := true
        AB_OTA_PARTITIONS += vendor system system_dlkm vendor_dlkm product
        BOARD_USES_RECOVERY_AS_BOOT := false
        BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT := true
        TARGET_ARCH := arm64
        TARGET_ARCH_VARIANT := armv8-a
        TARGET_CPU_ABI := arm64-v8a
        TARGET_CPU_ABI2 := 
        TARGET_CPU_VARIANT := generic
        TARGET_CPU_VARIANT_RUNTIME := generic
        TARGET_2ND_ARCH := arm
        TARGET_2ND_ARCH_VARIANT := armv7-a-neon
        TARGET_2ND_CPU_ABI := armeabi-v7a
        TARGET_2ND_CPU_ABI2 := armeabi
        TARGET_2ND_CPU_VARIANT := generic
        TARGET_2ND_CPU_VARIANT_RUNTIME := generic
        DEXPREOPT_GENERATE_APEX_IMAGE := true
        TARGET_BOOTLOADER_BOARD_NAME := exdroid
        TARGET_NO_BOOTLOADER := true
        TARGET_SCREEN_DENSITY := 160
        BOARD_MKBOOTIMG_ARGS += --vendor_cmdline "$(BOARD_VENDOR_CMDLINE)"
        BOARD_MKBOOTIMG_ARGS += --pagesize $(BOARD_PAGE_SIZE) --board ""
        BOARD_MKBOOTIMG_ARGS += --kernel_offset $(BOARD_KERNEL_OFFSET)
        BOARD_MKBOOTIMG_ARGS += --ramdisk_offset $(BOARD_RAMDISK_OFFSET)
        BOARD_MKBOOTIMG_ARGS += --header_version $(BOARD_BOOT_HEADER_VERSION)
        BOARD_MKBOOTIMG_ARGS += --dtb_offset $(BOARD_DTB_OFFSET)
        BOARD_RAMDISK_USE_LZ4 := true
        TARGET_KERNEL_CONFIG := adt3_defconfig
        TARGET_KERNEL_SOURCE := kernel/askey/adt3
        BOARD_KERNEL_IMAGE_NAME := Image.lz4
        TARGET_FORCE_PREBUILT_KERNEL := true
        ifeq ($(TARGET_FORCE_PREBUILT_KERNEL),true)
        TARGET_PREBUILT_KERNEL := $(DEVICE_PATH)/prebuilt/kernel
        endif
        ifndef BOARD_PREBUILT_DTBOIMAGE
        BOARD_KERNEL_SEPARATED_DTBO := true
        endif
        TARGET_PREBUILT_DTB := $(DEVICE_PATH)/prebuilt/dtb.img
        ifndef TARGET_PREBUILT_DTB
        BOARD_INCLUDE_DTB_IN_BOOTIMG := true
        else
        BOARD_MKBOOTIMG_ARGS += --dtb $(TARGET_PREBUILT_DTB)
        endif
        BOARD_VENDOR_CMDLINE := loop.max_part=4 mmcblk.perdev_minors=16 firmware_class.path=/vendor/etc/firmware bootconfig loglevel=2 quiet
        BOARD_KERNEL_BASE := 0x40078000
        BOARD_PAGE_SIZE := 2048
        BOARD_KERNEL_OFFSET := 0x00008000
        BOARD_RAMDISK_OFFSET := 0x03588000
        BOARD_TAGS_OFFSET := 0xfff88100
        BOARD_BOOT_HEADER_VERSION := 4
        BOARD_HEADER_SIZE := 2128
        BOARD_DTB_SIZE := 176221
        BOARD_DTB_OFFSET := 0x03288000
        BOARD_FLASH_BLOCK_SIZE := 131072
        BOARD_BOOTIMAGE_PARTITION_SIZE := 33554432
        BOARD_RECOVERYIMAGE_PARTITION_SIZE := 33554432
        BOARD_HAS_LARGE_FILESYSTEM := true
        BOARD_SYSTEMIMAGE_PARTITION_TYPE := ext4
        BOARD_USERDATAIMAGE_FILE_SYSTEM_TYPE := f2fs
        BOARD_VENDORIMAGE_FILE_SYSTEM_TYPE := ext4
        TARGET_COPY_OUT_VENDOR := vendor
        BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE := 33554432
        BOARD_SUPER_PARTITION_SIZE := 9126805504
        BOARD_SUPER_PARTITION_GROUPS := askey_dynamic_partitions
        BOARD_ASKEY_DYNAMIC_PARTITIONS_PARTITION_LIST := system system_dlkm vendor vendor_dlkm product
        BOARD_ASKEY_DYNAMIC_PARTITIONS_SIZE := 9122611200
        TARGET_BOARD_PLATFORM := diana
        TARGET_USERIMAGES_USE_EXT4 := true
        TARGET_USERIMAGES_USE_F2FS := true
        VENDOR_SECURITY_PATCH := 2021-08-01
        BOARD_AVB_ENABLE := true
        BOARD_AVB_MAKE_VBMETA_IMAGE_ARGS += --flags 3
        TW_HAS_NO_RECOVERY_PARTITION := true
        TW_THEME := landscape_hdpi
        TW_EXTRA_LANGUAGES := false
        TW_SCREEN_BLANK_ON_BOOT := true
        TW_INPUT_BLACKLIST := "hbtp_vm"
        TW_NO_USB_STORAGE := true
        TW_EXCLUDE_MTP := true
        TW_NO_EXFAT := true
        TW_INCLUDE_FB2PNG := false
        TW_EXCLUDE_TZDATA := true
        TW_EXCLUDE_NANO := true
        TW_INCLUDE_DUMLOCK := false
        TW_NO_BATT_PERCENT := true
        TW_NO_CPU_TEMP := true
        TW_INCLUDE_INJECTTWRP := false
        TW_HAS_DOWNLOAD_MODE := false
        TW_NO_HAPTICS := true
        TW_INCLUDE_NTFS_3G := false
        TW_EXCLUDE_TWRPAPP := true
        TW_NO_LEGACY_PROPS := true
        BOARD_HAS_NO_REAL_SDCARD := true
        TW_EXCLUDE_SUPERSU := true
        TW_INCLUDE_CRYPTO := false
        TWRP_INCLUDE_LOGCAT := false
        TW_USE_TOOLBOX := true
        TW_INCLUDE_REPACKTOOLS := true
        TW_INCLUDE_LIBRESETPROP := true
        TW_INCLUDE_RESETPROP := true
        TW_EXCLUDE_APEX := true
        TW_SKIP_ADDITIONAL_FSTAB := true
        EOF

        FSTAB_FILE=$(find . -name "twrp.fstab" | head -n 1)
        if [ -n "$FSTAB_FILE" ]; then
          cat << 'EOF' > "$FSTAB_FILE"
        /system          ext4      system                                     flags=display="System";logical;slotselect
